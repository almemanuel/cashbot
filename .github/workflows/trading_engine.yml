name: CashBot Trading Engine

on:
  schedule:
    # Executa a cada 15 minutos (checa Take Profit sempre com custo zero; IA com cooldown inteligente)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_simulation:
        description: 'Rodar em Modo Simulado?'
        required: true
        type: boolean
        default: true
      force_buy:
        description: 'Forçar disparo de compra para teste de notificação?'
        required: true
        type: boolean
        default: false

concurrency:
  group: cashbot-trading-engine
  cancel-in-progress: false

jobs:
  trade_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Executar Ciclo Operacional
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_SECRET_KEY: ${{ secrets.BINANCE_TESTNET_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULATION_MODE: ${{ github.event.inputs.force_simulation || 'true' }}
          WITHDRAW_WINDOW_START_BRT: ${{ secrets.WITHDRAW_WINDOW_START_BRT || '22' }}
          WITHDRAW_WINDOW_END_BRT: ${{ secrets.WITHDRAW_WINDOW_END_BRT || '23' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_buy }}" = "true" ]; then
            FLAGS="$FLAGS --force-buy"
          fi
          python engine/main.py $FLAGS

